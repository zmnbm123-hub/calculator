<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الآلة الحاسبة</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050b13">
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 15% 75%, rgba(255, 40, 180, 0.18), transparent 25%),
                radial-gradient(circle at 90% 35%, rgba(0, 220, 255, 0.18), transparent 25%),
                radial-gradient(circle at 70% 100%, rgba(130, 30, 255, 0.12), transparent 25%),
                #050b13;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 920px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 35px;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.65);
            position: relative;
            overflow: hidden;
            padding: 12px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #9cc8d7;
            transition: 0.2s;
            padding: 5px 8px;
            border-radius: 10px;
        }

        .icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9cc8d7;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: rgba(0, 220, 255, 0.2);
            color: #ffffff;
            border-color: #00dcff;
        }

        .dropdown-menu {
            position: absolute;
            top: 50px;
            left: 15px;
            background: rgba(15, 25, 40, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            width: 200px;
            z-index: 100;
            backdrop-filter: blur(15px);
        }

        html[dir="rtl"] .dropdown-menu {
            left: auto;
            right: 15px;
        }

        .dropdown-menu button {
            background: none;
            border: none;
            padding: 12px 15px;
            text-align: inherit;
            font-size: 14px;
            cursor: pointer;
            color: #f4fbff;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dropdown-menu button:hover {
            background: rgba(255,255,255,0.1);
        }

        .history-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050b13;
            transition: transform 0.3s ease-in-out;
            transform: translateY(100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .history-panel.active {
            transform: translateY(0);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .history-content {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 16px;
            color: #9cc8d7;
        }

        .view-section {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .view-section.active {
            display: flex;
        }

        .display-container {
            padding: 10px 15px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 105px;
        }

        .expression {
            font-size: 30px;
            color: #ffffff;
            font-weight: 600;
            min-height: 38px;
            word-break: break-all;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 220, 255, 0.3);
        }

        .live-result {
            font-size: 18px;
            color: rgba(156, 200, 215, 0.5);
            min-height: 24px;
            word-break: break-all;
            letter-spacing: 1px;
        }

        .toggle-scientific {
            background: none;
            border: none;
            font-size: 22px;
            color: #9cc8d7;
            padding: 2px 10px;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        .keypad {
            padding: 2px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .scientific-rows {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 2px;
        }

        .scientific-rows.show {
            display: flex;
        }

        .btn-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            height: 56px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            color: #f4fbff;
            font-size: 19px;
            font-weight: 500;
            cursor: pointer;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, background 0.2s;
        }

        .scientific-rows.show ~ .btn-row .btn,
        .scientific-rows.show + .btn-row .btn {
            height: 50px;
            font-size: 17px;
        }

        .scientific-rows .btn {
            height: 48px;
            font-size: 15px;
        }

        .btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }

        .btn.function {
            color: #ff7de5;
            background: linear-gradient(145deg, rgba(255, 90, 210, 0.18), rgba(255, 90, 210, 0.04));
            border-color: rgba(255, 100, 220, 0.4);
        }

        .btn.operator {
            color: #62ffff;
            background: linear-gradient(145deg, rgba(70, 230, 255, 0.18), rgba(70, 230, 255, 0.04));
            border-color: rgba(70, 230, 255, 0.3);
        }

        .btn.equal {
            color: #ffffff;
            background: linear-gradient(145deg, #18c8e8, #168be7);
            border-color: rgba(110, 245, 255, 0.7);
            box-shadow: 0 8px 20px rgba(0, 205, 255, 0.3);
        }

        .converter-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }

        .converter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .converter-group label {
            color: #9cc8d7;
            font-size: 14px;
        }

        .converter-select, .converter-input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .converter-select option {
            background: #050b13;
            color: #fff;
        }

        .ad-banner-placeholder {
            width: 100%;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="top-bar">
            <button class="icon-btn" id="menuBtn">⋮</button>
            <div class="nav-tabs">
                <button class="tab-btn active" id="calcTabBtn" onclick="switchTab('calc')">حاسبة</button>
                <button class="tab-btn" id="unitTabBtn" onclick="switchTab('unit')">محول الوحدات</button>
            </div>
            <button class="icon-btn" id="historyBtn">🕒</button>
        </div>

        <div class="dropdown-menu" id="dropdownMenu">
            <button id="langToggleBtn" onclick="toggleLanguage()">English 🌐</button>
            <button id="installAppBtn" style="color: #62ffff; font-weight: bold;">تثبيت التطبيق 📱</button>
            <button id="clearHistoryMenuBtn" onclick="clearHistory()">محو السجل 🗑️</button>
        </div>

        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <span id="historyTitle">السجل</span>
                <button class="icon-btn" id="closeHistoryBtn">✕</button>
            </div>
            <div class="history-content" id="historyContent">
                <p style="color: #666; text-align: center; margin-top: 50px;" id="emptyHistoryTxt">لا يوجد سجل عمليات</p>
            </div>
        </div>

        <div class="view-section active" id="calcSection">
            <div class="display-container">
                <div class="expression" id="expression">0</div>
                <div class="live-result" id="liveResult"></div>
            </div>

            <button class="toggle-scientific" id="toggleBtn">⌄</button>

            <div class="keypad">
                <div class="scientific-rows" id="scientificRows">
                    <div class="btn-row">
                        <button class="btn function" onclick="appendValue('√(')">√</button>
                        <button class="btn function" onclick="appendValue('Math.PI')">π</button>
                        <button class="btn function" onclick="appendValue('**')">^</button>
                        <button class="btn function" onclick="appendValue('!')">!</button>
                    </div>
                    <div class="btn-row">
                        <button class="btn function" id="angleModeBtn" onclick="toggleAngleMode()">Deg</button>
                        <button class="btn function" onclick="appendTrig('sin')">sin</button>
                        <button class="btn function" onclick="appendTrig('cos')">cos</button>
                        <button class="btn function" onclick="appendTrig('tan')">tan</button>
                    </div>
                    <div class="btn-row">
                        <button class="btn function" onclick="toggleInverse()" id="invBtn">Inv</button>
                        <button class="btn function" onclick="appendValue('Math.E')">e</button>
                        <button class="btn function" onclick="appendValue('Math.exp(')">e^x</button>
                        <button class="btn function" onclick="appendValue('Math.log10(')">log</button>
                    </div>
                </div>

                <div class="btn-row">
                    <button class="btn function" onclick="clearAll()">AC</button>
                    <button class="btn operator" onclick="appendValue('(')">(</button>
                    <button class="btn operator" onclick="appendValue(')')">)</button>
                    <button class="btn operator" onclick="appendValue('÷')">÷</button>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="appendValue('7')">7</button>
                    <button class="btn" onclick="appendValue('8')">8</button>
                    <button class="btn" onclick="appendValue('9')">9</button>
                    <button class="btn operator" onclick="appendValue('×')">×</button>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="appendValue('4')">4</button>
                    <button class="btn" onclick="appendValue('5')">5</button>
                    <button class="btn" onclick="appendValue('6')">6</button>
                    <button class="btn operator" onclick="appendValue('-')">-</button>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="appendValue('1')">1</button>
                    <button class="btn" onclick="appendValue('2')">2</button>
                    <button class="btn" onclick="appendValue('3')">3</button>
                    <button class="btn operator" onclick="appendValue('+')">+</button>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="appendValue('0')">0</button>
                    <button class="btn" onclick="appendValue('.')">.</button>
                    <button class="btn operator" onclick="deleteLast()">⌫</button>
                    <button class="btn equal" onclick="calculate()">=</button>
                </div>
            </div>
        </div>

        <div class="view-section" id="unitSection">
            <div class="converter-container">
                <div class="converter-group">
                    <label id="lblType">نوع التحويل:</label>
                    <select class="converter-select" id="unitType" onchange="updateUnitOptions()">
                        <option value="length">الطول (Length)</option>
                        <option value="weight">الوزن (Weight)</option>
                        <option value="temp">الحرارة (Temperature)</option>
                    </select>
                </div>

                <div class="converter-group">
                    <label id="lblFrom">من:</label>
                    <input type="number" class="converter-input" id="unitInput" placeholder="أدخل القيمة" oninput="convertUnits()">
                    <select class="converter-select" id="unitFrom" onchange="convertUnits()"></select>
                </div>

                <div class="converter-group">
                    <label id="lblTo">إلى:</label>
                    <select class="converter-select" id="unitTo" onchange="convertUnits()"></select>
                </div>

                <div class="display-container" style="min-height: 100px; background: rgba(255,255,255,0.03); border-radius: 15px; margin-top: 10px;">
                    <div class="live-result" id="unitResult" style="font-size: 28px; color: #fff;">0</div>
                </div>
            </div>
        </div>

        <div class="ad-banner-placeholder">
            <span>ADVERTISEMENT</span>
        </div>
    </div>

    <script>
        const expressionEl = document.getElementById('expression');
        const liveResultEl = document.getElementById('liveResult');
        const toggleBtn = document.getElementById('toggleBtn');
        const scientificRows = document.getElementById('scientificRows');
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const historyBtn = document.getElementById('historyBtn');
        const historyPanel = document.getElementById('historyPanel');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const historyContent = document.getElementById('historyContent');
        const installAppBtn = document.getElementById('installAppBtn');
        const angleModeBtn = document.getElementById('angleModeBtn');
        const invBtn = document.getElementById('invBtn');

        let currentExpression = '';
        let historyList = JSON.parse(localStorage.getItem('calc_history') || '[]');
        let currentLang = 'ar';
        let isInvActive = false;
        let isDegMode = true;
        let deferredPrompt;

        const translations = {
            ar: {
                calcTab: "حاسبة",
                unitTab: "محول الوحدات",
                langBtn: "English 🌐",
                installBtn: "تثبيت التطبيق 📱",
                clearHistory: "محو السجل 🗑️",
                historyTitle: "السجل",
                emptyHistory: "لا يوجد سجل عمليات",
                lblType: "نوع التحويل:",
                lblFrom: "من:",
                lblTo: "إلى:",
                inputPh: "أدخل القيمة"
            },
            en: {
                calcTab: "Calculator",
                unitTab: "Converter",
                langBtn: "العربية 🌐",
                installBtn: "Install App 📱",
                clearHistory: "Clear History 🗑️",
                historyTitle: "History",
                emptyHistory: "No history available",
                lblType: "Conversion Type:",
                lblFrom: "From:",
                lblTo: "To:",
                inputPh: "Enter value"
            }
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installAppBtn.addEventListener('click', async () => {
            dropdownMenu.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert(currentLang === 'ar' ? 
                    'يمكنك تثبيت التطبيق بالضغط على قائمة المتصفح واختيار "إضافة إلى الشاشة الرئيسية"' : 
                    'You can install the app via browser menu: "Add to Home Screen"');
            }
        });

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const htmlTag = document.getElementById('htmlTag');
            htmlTag.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            htmlTag.setAttribute('lang', currentLang);

            const t = translations[currentLang];
            document.getElementById('calcTabBtn').textContent = t.calcTab;
            document.getElementById('unitTabBtn').textContent = t.unitTab;
            document.getElementById('langToggleBtn').textContent = t.langBtn;
            document.getElementById('installAppBtn').textContent = t.installBtn;
            document.getElementById('clearHistoryMenuBtn').textContent = t.clearHistory;
            document.getElementById('historyTitle').textContent = t.historyTitle;
            document.getElementById('lblType').textContent = t.lblType;
            document.getElementById('lblFrom').textContent = t.lblFrom;
            document.getElementById('lblTo').textContent = t.lblTo;
            document.getElementById('unitInput').placeholder = t.inputPh;

            updateHistoryUI();
            dropdownMenu.style.display = 'none';
        }

        // اكتشاف لغة جهاز المستخدم تلقائياً عند تشغيل التطبيق لأول مرة
        const systemLang = navigator.language || navigator.userLanguage;
        if (systemLang && systemLang.startsWith('en')) {
            toggleLanguage();
        }

        function switchTab(tab) {
            document.getElementById('calcTabBtn').classList.toggle('active', tab === 'calc');
            document.getElementById('unitTabBtn').classList.toggle('active', tab === 'unit');
            document.getElementById('calcSection').classList.toggle('active', tab === 'calc');
            document.getElementById('unitSection').classList.toggle('active', tab === 'unit');
            if (tab === 'unit') updateUnitOptions();
        }

        toggleBtn.addEventListener('click', () => {
            scientificRows.classList.toggle('show');
            toggleBtn.textContent = scientificRows.classList.contains('show') ? '⌃' : '⌄';
        });

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.style.display = dropdownMenu.style.display === 'flex' ? 'none' : 'flex';
        });

        window.addEventListener('click', () => dropdownMenu.style.display = 'none');

        historyBtn.addEventListener('click', () => {
            updateHistoryUI();
            historyPanel.classList.add('active');
        });
        closeHistoryBtn.addEventListener('click', () => historyPanel.classList.remove('active'));

        function appendValue(val) {
            if (expressionEl.textContent === '0' && val !== '.' && !['+', '×', '÷', '**'].includes(val)) {
                currentExpression = '';
            }
            currentExpression += val;
            expressionEl.textContent = currentExpression;
            updateLiveResult();
        }

        function toggleAngleMode() {
            isDegMode = !isDegMode;
            angleModeBtn.textContent = isDegMode ? 'Deg' : 'Rad';
        }

        function toggleInverse() {
            isInvActive = !isInvActive;
            invBtn.style.background = isInvActive ? 'rgba(0, 220, 255, 0.3)' : '';
            const trigBtns = document.querySelectorAll('.scientific-rows .btn-row:nth-child(2) button');
            if (trigBtns.length >= 4) {
                trigBtns[1].textContent = isInvActive ? 'sin⁻¹' : 'sin';
                trigBtns[2].textContent = isInvActive ? 'cos⁻¹' : 'cos';
                trigBtns[3].textContent = isInvActive ? 'tan⁻¹' : 'tan';
            }
        }

        function appendTrig(type) {
            let funcName = type;
            if (isInvActive) {
                if (type === 'sin') funcName = 'asin';
                if (type === 'cos') funcName = 'acos';
                if (type === 'tan') funcName = 'atan';
            }
            if (expressionEl.textContent === '0') {
                currentExpression = '';
            }
            currentExpression += `Math.${funcName}(`;
            expressionEl.textContent = currentExpression;
        }

        function clearAll() {
            currentExpression = '';
            expressionEl.textContent = '0';
            liveResultEl.textContent = '';
        }

        function deleteLast() {
            currentExpression = currentExpression.slice(0, -1);
            expressionEl.textContent = currentExpression === '' ? '0' : currentExpression;
            if (currentExpression === '') {
                liveResultEl.textContent = '';
            } else {
                updateLiveResult();
            }
        }

        function getEvalString() {
            return currentExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/√\(/g, 'Math.sqrt(');
        }

        function prepareExpressionForEval(expr) {
            let parsed = expr;
            if (isDegMode) {
                parsed = parsed.replace(/Math\.sin\((.*?)\)/g, (m, p1) => `Math.sin((${p1}) * Math.PI / 180)`);
                parsed = parsed.replace(/Math\.cos\((.*?)\)/g, (m, p1) => `Math.cos((${p1}) * Math.PI / 180)`);
                parsed = parsed.replace(/Math\.tan\((.*?)\)/g, (m, p1) => `Math.tan((${p1}) * Math.PI / 180)`);
            }
            return parsed;
        }

        function updateLiveResult() {
            try {
                let evalString = prepareExpressionForEval(getEvalString());
                if (/[\+\-\*\/\.]$/.test(evalString)) return;
                
                evalString = evalString.replace(/(\d+)!/g, (match, number) => factorial(parseInt(number)));

                let res = eval(evalString);
                if (res !== undefined && !isNaN(res)) {
                    liveResultEl.textContent = res;
                }
            } catch (err) {
                liveResultEl.textContent = '';
            }
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) result *= i;
            return result;
        }

        function calculate() {
            try {
                let evalString = prepareExpressionForEval(getEvalString());
                evalString = evalString.replace(/(\d+)!/g, (match, number) => factorial(parseInt(number)));
                
                let res = eval(evalString);
                
                expressionEl.textContent = res;
                liveResultEl.textContent = currentExpression + " =";
                
                historyList.push(`${currentExpression} = ${res}`);
                localStorage.setItem('calc_history', JSON.stringify(historyList));
                
                currentExpression = res.toString();
            } catch (err) {
                expressionEl.textContent = currentLang === 'ar' ? 'خطأ' : 'Error';
                liveResultEl.textContent = '';
            }
        }

        function updateHistoryUI() {
            const t = translations[currentLang];
            if (historyList.length === 0) {
                historyContent.innerHTML = `<p style="color: #666; text-align: center; margin-top: 50px;">${t.emptyHistory}</p>`;
                return;
            }
            historyContent.innerHTML = historyList.map(item => 
                `<div style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: #9cc8d7;">${item}</div>`
            ).join('');
        }

        function clearHistory() {
            historyList = [];
            localStorage.removeItem('calc_history');
            updateHistoryUI();
        }

        const unitsData = {
            length: {
                meter: 1,
                kilometer: 0.001,
                centimeter: 100,
                millimeter: 1000,
                inch: 39.3701,
                foot: 3.28084
            },
            weight: {
                kilogram: 1,
                gram: 1000,
                pound: 2.20462,
                ounce: 35.274
            }
        };

        function updateUnitOptions() {
            const type = document.getElementById('unitType').value;
            const fromSelect = document.getElementById('unitFrom');
            const toSelect = document.getElementById('unitTo');

            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';

            if (type === 'temp') {
                const tempUnits = ['Celsius', 'Fahrenheit', 'Kelvin'];
                tempUnits.forEach(u => {
                    fromSelect.add(new Option(u, u));
                    toSelect.add(new Option(u, u));
                });
            } else {
                Object.keys(unitsData[type]).forEach(u => {
                    fromSelect.add(new Option(u, u));
                    toSelect.add(new Option(u, u));
                });
            }
            convertUnits();
        }

        function convertUnits() {
            const val = parseFloat(document.getElementById('unitInput').value);
            const type = document.getElementById('unitType').value;
            const from = document.getElementById('unitFrom').value;
            const to = document.getElementById('unitTo').value;
            const resEl = document.getElementById('unitResult');

            if (isNaN(val)) {
                resEl.textContent = '0';
                return;
            }

            if (type === 'temp') {
                let res = val;
                if (from === 'Celsius' && to === 'Fahrenheit') res = (val * 9/5) + 32;
                else if (from === 'Celsius' && to === 'Kelvin') res = val + 273.15;
                else if (from === 'Fahrenheit' && to === 'Celsius') res = (val - 32) * 5/9;
                else if (from === 'Fahrenheit' && to === 'Kelvin') res = (val - 32) * 5/9 + 273.15;
                else if (from === 'Kelvin' && to === 'Celsius') res = val - 273.15;
                else if (from === 'Kelvin' && to === 'Fahrenheit') res = (val - 273.15) * 9/5 + 32;
                resEl.textContent = res.toFixed(2);
            } else {
                const baseVal = val / unitsData[type][from];
                const finalVal = baseVal * unitsData[type][to];
                resEl.textContent = finalVal.toFixed(4);
            }
        }

        updateHistoryUI();
    </script>
</body>
</html>
