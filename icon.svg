<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- خلفية الأيقونة المظلمة المطابقة لداخل التطبيق -->
  <rect width="512" height="512" rx="110" fill="#050b13"/>
  <rect x="20" y="20" width="472" height="472" rx="95" fill="none" stroke="rgba(0, 220, 255, 0.2)" stroke-width="6"/>

  <!-- الدائرة الأولى: + -->
  <circle cx="170" cy="170" r="75" fill="rgba(70, 230, 255, 0.15)" stroke="#00dcff" stroke-width="8"/>
  <path d="M170 125 v90 M125 170 h90" stroke="#00dcff" stroke-width="16" stroke-linecap="round"/>

  <!-- الدائرة الثانية: × -->
  <circle cx="342" cy="170" r="75" fill="rgba(255, 90, 210, 0.15)" stroke="#ff7de5" stroke-width="8"/>
  <path d="M310 138 l64 64 M374 138 l-64 64" stroke="#ff7de5" stroke-width="16" stroke-linecap="round"/>

  <!-- الدائرة الثالثة: ÷ -->
  <circle cx="170" cy="342" r="75" fill="rgba(255, 90, 210, 0.15)" stroke="#ff7de5" stroke-width="8"/>
  <line x1="125" y1="342" x2="215" y2="342" stroke="#ff7de5" stroke-width="16" stroke-linecap="round"/>
  <circle cx="170" cy="310" r="10" fill="#ff7de5"/>
  <circle cx="170" cy="374" r="10" fill="#ff7de5"/>

  <!-- الدائرة الرابعة: = -->
  <circle cx="342" cy="342" r="75" fill="url(#blueGrad)" stroke="#62ffff" stroke-width="8"/>
  <line x1="300" y1="326" x2="384" y2="326" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="300" y1="358" x2="384" y2="358" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18c8e8"/>
      <stop offset="100%" stop-color="#168be7"/>
    </linearGradient>
  </defs>
</svg>
